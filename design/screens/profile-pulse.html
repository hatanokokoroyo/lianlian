<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>档案 · 节拍</title>
<link rel="stylesheet" href="pulse.css">
</head>
<body class="bg-black/90">
<div class="mx-auto flex min-h-[800px] w-[360px] flex-col bg-background text-foreground border-x border-border">

  <header class="px-4 pt-5">
    <p class="text-[11px] text-muted-foreground">上次评估 11月12日</p>
    <h1 class="mt-2 text-[26px] font-semibold leading-tight tracking-tight">身体档案</h1>
    <div class="mt-3 flex flex-wrap gap-1.5">
      <span class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-muted-foreground">178 cm</span>
      <span class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-muted-foreground">74.2 kg</span>
      <span class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-muted-foreground">每周 3 次 · 家</span>
    </div>
  </header>

  <div class="mt-4 flex items-center justify-between px-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">髋</p>
    <p class="text-[10px] text-muted-foreground">3 个部位</p>
  </div>

  <div class="mt-2 space-y-2 px-4">
    <button class="w-full rounded-xl bg-card px-4 py-3.5 text-left" data-testid="site-gluteus-maximus">
      <div class="flex items-baseline justify-between">
        <p class="text-[15px] font-medium">臀大肌 <span class="text-[10px] font-normal text-muted-foreground">左</span></p>
        <span class="text-[10px] text-muted-foreground">3 天前</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <span class="rounded-full bg-accent/15 px-2 py-0.5 text-[10px] text-accent">张力 弱</span>
      </div>
    </button>
    <button class="w-full rounded-xl bg-card px-4 py-3.5 text-left" data-testid="site-gluteus-medius">
      <div class="flex items-baseline justify-between">
        <p class="text-[15px] font-medium">臀中肌 <span class="text-[10px] font-normal text-muted-foreground">左</span></p>
        <span class="text-[10px] text-muted-foreground">3 天前</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <span class="rounded-full bg-accent/15 px-2 py-0.5 text-[10px] text-accent">张力 弱</span>
        <span class="rounded-full bg-destructive/15 px-2 py-0.5 text-[10px] text-destructive">对称 左弱</span>
      </div>
    </button>
    <button class="w-full rounded-xl bg-card px-4 py-3.5 text-left" data-testid="site-psoas-major">
      <div class="flex items-baseline justify-between">
        <p class="text-[15px] font-medium">腰大肌 <span class="text-[10px] font-normal text-muted-foreground">双侧</span></p>
        <span class="text-[10px] text-muted-foreground">3 天前</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <span class="rounded-full bg-destructive/15 px-2 py-0.5 text-[10px] text-destructive">张力 紧</span>
      </div>
    </button>
  </div>

  <div class="mt-5 px-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">小腿</p>
  </div>
  <div class="mt-2 px-4">
    <button class="w-full rounded-xl border border-border px-4 py-3.5 text-left" data-testid="site-gastrocnemius">
      <div class="flex items-baseline justify-between">
        <p class="text-[15px] font-medium text-muted-foreground">腓肠肌 <span class="text-[10px] font-normal">左</span></p>
        <span class="text-[10px] text-muted-foreground">2 周前</span>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <span class="rounded-full px-2 py-0.5 text-[10px] text-primary ring-1 ring-primary/30">已解决 · 张力 正常</span>
      </div>
    </button>
  </div>

  <div class="flex-1"></div>

  <footer class="mx-4 mb-4 rounded-xl bg-card px-4 py-3">
    <div class="flex items-center justify-between">
      <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">训练条件</p>
      <button class="text-[10px] text-accent" data-testid="edit-training-context">修改</button>
    </div>
    <p class="mt-2 text-[12px] leading-relaxed text-muted-foreground">每周 3 次、每次 30 分钟 · 在家 · 弹力带 + 8kg 哑铃</p>
    <div class="mt-3 flex items-center justify-between border-t border-border pt-2.5 text-[10px] text-muted-foreground">
      <span>本地数据 1.2 MB</span>
      <button data-testid="open-conversations">全部会话</button>
    </div>
  </footer>

</div>
</body>
</html>
