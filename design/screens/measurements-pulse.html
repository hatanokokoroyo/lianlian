<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体重趋势 · 节拍</title>
<link rel="stylesheet" href="pulse.css">
</head>
<body class="bg-black/90">
<div class="mx-auto flex min-h-[800px] w-[360px] flex-col bg-background text-foreground border-x border-border">

  <header class="flex items-center gap-3 px-4 pt-4">
    <a href="profile-pulse.html" class="text-[16px] text-muted-foreground" data-testid="back">&larr;</a>
    <div>
      <p class="text-[10px] text-muted-foreground">最近 8 次</p>
      <h1 class="text-[20px] font-semibold tracking-tight">体重</h1>
    </div>
  </header>

  <section class="mx-4 mt-4 rounded-xl bg-card p-4">
    <div class="flex items-baseline gap-2">
      <span class="text-[28px] font-semibold leading-none tabular-nums">74.2</span>
      <span class="text-[11px] text-muted-foreground">kg</span>
      <span class="ml-auto text-[10px] text-primary">-1.4 本月</span>
    </div>

    <svg viewBox="0 0 300 96" class="mt-3 w-full" data-testid="weight-chart">
      <polyline points="4,58 46,54 88,60 130,44 172,48 214,36 256,40 296,28"
                fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="stroke-primary"></polyline>
      <circle cx="296" cy="28" r="3" class="fill-primary"></circle>
    </svg>
    <div class="flex justify-between text-[9px] text-muted-foreground">
      <span>9-20</span><span>10-04</span><span>10-18</span><span>11-01</span><span>11-14</span>
    </div>
  </section>

  <div class="mt-4 flex items-center justify-between px-4">
    <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">记录</p>
    <button class="text-[10px] text-accent" data-testid="add-measurement">＋ 记一次</button>
  </div>

  <ul class="mt-2 flex-1 divide-y divide-border px-4 text-[12px]">
    <li class="flex items-center justify-between py-2.5">
      <span class="text-muted-foreground tabular-nums">11-14</span>
      <span class="tabular-nums">74.2 kg</span>
      <button class="text-[10px] text-muted-foreground" data-testid="delete-measurement">删除</button>
    </li>
    <li class="flex items-center justify-between py-2.5">
      <span class="text-muted-foreground tabular-nums">11-08</span>
      <span class="tabular-nums">74.6 kg</span>
      <button class="text-[10px] text-muted-foreground">删除</button>
    </li>
    <li class="flex items-center justify-between py-2.5">
      <span class="text-muted-foreground tabular-nums">11-01</span>
      <span class="tabular-nums">75.6 kg</span>
      <button class="text-[10px] text-muted-foreground">删除</button>
    </li>
    <li class="flex items-center justify-between py-2.5">
      <span class="text-muted-foreground tabular-nums">10-18</span>
      <span class="tabular-nums">75.1 kg</span>
      <button class="text-[10px] text-muted-foreground">删除</button>
    </li>
  </ul>

  <div class="mx-4 mb-4 rounded-xl border border-border px-3.5 py-2.5">
    <p class="text-[10px] leading-relaxed text-muted-foreground">测量是唯一允许单条删除的数据；档案里 agent 的判定只能追加更正，不能删。</p>
  </div>
</div>
</body>
</html>
