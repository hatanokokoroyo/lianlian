<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日 · 铁馆</title>
<link rel="stylesheet" href="iron.css">
</head>
<body class="bg-black/90">
<div class="mx-auto flex min-h-[800px] w-[360px] flex-col bg-background text-foreground border-x border-border">

  <header class="px-5 pt-5">
    <div class="flex items-baseline justify-between">
      <p class="text-xs text-muted-foreground">11月15日 · 周六</p>
      <p class="text-xs text-muted-foreground">本周 <span class="text-sm font-semibold text-foreground tabular-nums">2</span>/3</p>
    </div>
    <h1 class="mt-2 text-[30px] font-bold leading-none tracking-tight">臀腿日</h1>
    <p class="mt-2 text-xs text-muted-foreground">来自 11月12日 评估 · 距复查 25 天</p>
  </header>

  <section class="mt-6 px-5">
    <div class="flex items-end gap-2">
      <span class="text-[52px] font-bold leading-none tabular-nums">1</span>
      <span class="pb-1.5 text-sm text-muted-foreground">/ 4 项完成</span>
    </div>
    <div class="mt-3 h-1 w-full rounded-full bg-muted">
      <div class="h-1 w-1/4 rounded-full bg-primary"></div>
    </div>
  </section>

  <ul class="mt-6 flex-1 border-t border-border">
    <li class="flex gap-3 border-b border-border px-5 py-4" data-testid="exercise-glute-bridge">
      <div class="mt-1.5 h-10 w-[3px] shrink-0 rounded-full bg-primary"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <h2 class="truncate text-[17px] font-semibold">臀桥</h2>
          <span class="shrink-0 text-sm text-muted-foreground tabular-nums">3×10</span>
        </div>
        <p class="mt-1 text-[11px] text-muted-foreground">臀大肌 张力弱 · 左</p>
      </div>
      <div class="mt-1.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-primary text-[13px] font-bold text-primary-foreground">✓</div>
    </li>

    <li class="flex gap-3 border-b border-border px-5 py-4" data-testid="exercise-clamshell">
      <div class="mt-1.5 h-10 w-[3px] shrink-0 rounded-full bg-accent"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <h2 class="truncate text-[17px] font-semibold">蚌式开合</h2>
          <span class="shrink-0 text-sm text-muted-foreground tabular-nums">3×10</span>
        </div>
        <p class="mt-1 text-[11px] text-muted-foreground">臀中肌 对称·左弱 · 进行到 2/3 组</p>
      </div>
      <div class="mt-1.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-accent text-[11px] font-bold text-accent">2</div>
    </li>

    <li class="flex gap-3 border-b border-border px-5 py-4" data-testid="exercise-deadbug">
      <div class="mt-1.5 h-10 w-[3px] shrink-0 rounded-full bg-muted"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <h2 class="truncate text-[17px] font-semibold">死虫式</h2>
          <span class="shrink-0 text-sm text-muted-foreground tabular-nums">3×10</span>
        </div>
        <p class="mt-1 text-[11px] text-muted-foreground">腹横肌 稳定性差</p>
      </div>
      <div class="mt-1.5 h-6 w-6 shrink-0 rounded-full border-2 border-border"></div>
    </li>

    <li class="flex gap-3 border-b border-border px-5 py-4" data-testid="exercise-sl-glute-bridge">
      <div class="mt-1.5 h-10 w-[3px] shrink-0 rounded-full bg-muted"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <h2 class="truncate text-[17px] font-semibold">单腿臀桥</h2>
          <span class="shrink-0 text-sm text-muted-foreground tabular-nums">2×8</span>
        </div>
        <p class="mt-1 text-[11px] text-muted-foreground">臀中肌 左弱 · 膝不要内扣</p>
      </div>
      <div class="mt-1.5 h-6 w-6 shrink-0 rounded-full border-2 border-border"></div>
    </li>
  </ul>

  <footer class="border-t border-border px-5 py-4">
    <div class="flex items-center justify-between">
      <p class="text-xs text-muted-foreground">还差 2 项 · 预计 12 分钟</p>
      <button class="rounded-lg bg-muted px-4 py-2 text-sm font-semibold text-muted-foreground" disabled data-testid="checkin">打卡</button>
    </div>
    <div class="mt-3 flex items-center justify-between text-[11px]">
      <button class="text-muted-foreground underline underline-offset-4" data-testid="postpone">整天推迟</button>
      <button class="text-muted-foreground underline underline-offset-4" data-testid="skip-exercise">跳过一项</button>
    </div>
  </footer>

</div>
</body>
</html>
