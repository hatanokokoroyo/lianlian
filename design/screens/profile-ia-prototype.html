<title>档案信息架构 · throwaway 原型</title>
<!--
  THROWAWAY PROTOTYPE — 档案页信息架构（profile-navigation）。
  这不是实现稿，也不进主分支：只用来比较三种根页结构，以及“区域索引 → 区域子页”的
  进入/返回是否顺手。真实实现按 NSH 重写，不复用这里的 innerHTML / 事件委托。

  切换：底部浮动条，或键盘 ← / →。默认打开 D（组合方案）。状态写在 URL hash：
    #variant=D&page=root
    #variant=B&section=gluteal-group
    #variant=C&page=plan
-->
<link rel="stylesheet" href="pulse.css">
<style>
  html, body { background: #000; }
  body { margin: 0; }
  .proto-switcher {
    position: fixed;
    left: 50%;
    bottom: 104px;
    z-index: 50;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 999px;
    background: var(--color-primary);
    color: var(--color-primary-foreground);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    font: 600 11px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
  }
  .proto-switcher button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 999px;
    background: rgba(16, 18, 12, .12);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .proto-switcher button:active { background: rgba(16, 18, 12, .24); }
  .proto-switcher .proto-label { min-width: 150px; text-align: center; }
  .proto-switcher .proto-label small {
    display: block;
    margin-top: 2px;
    font-size: 9px;
    font-weight: 400;
    opacity: .72;
  }
  .proto-site .detail { display: none; }
  .proto-site.open .detail { display: block; }
  .proto-site.open .chev { transform: rotate(180deg); }
  .proto-border-bad { border: 1px solid rgba(255, 107, 107, .45); }
  .proto-scroll { padding-bottom: 128px; }
</style>
</head>

function readHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  const variant = params.get("variant");
  if (VARIANTS[variant]) state.variant = variant;
  const page = params.get("page");
  if (["root", "plan"].includes(page)) state.page = page;
  const section = params.get("section");
  if (section && SECTION_BY_ID[section]) {
    state.page = "section";
    state.section = section;
  }
  const dataPage = params.get("data");
  if (dataPage && DATA_PAGES[dataPage]) {
    state.page = "data";
    state.dataPage = dataPage;
  }
}

function writeHash() {
  const params = new URLSearchParams();
  params.set("variant", state.variant);
  if (state.page === "section") params.set("section", state.section);
  else if (state.page === "data") params.set("data", state.dataPage);
  else if (state.page !== "root") params.set("page", state.page);
  const next = "#" + params.toString();
  if (location.hash === next) return;
  try {
    history.replaceState(null, "", next);
  } catch {
    location.hash = next;
  }
}

function goRoot() {
  state.page = "root";
  state.section = null;
  state.dataPage = null;
}

function sectionRow(section) {

      </div>
    </button>
  `;
}

}

function filterChip(key, label, count) {
  const active = state.filter === key;

}

    if (state.filter === "abnormal" && section.abnormal === 0) return false;
    return true;
  });
}

    </div>
    <section class="mx-4 mt-3">
      <div class="flex items-end justify-between">
        <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">档案条目 · ${sections.length} 个区域</p>
        <p class="text-[10px] text-muted-foreground">${sections.reduce((sum, section) => sum + section.count, 0)} 处</p>
      </div>
      <div class="mt-2 space-y-1.5">${sections.map(sectionRow).join("") || `<p class="rounded-xl bg-card px-4 py-3 text-[11px] text-muted-foreground">这个筛选下没有区域。</p>`}</div>
    </section>
    ${planStrip()}
    ${dataBlock()}
  `;
}

function rootD() {
  const attention = SECTIONS.filter((section) => section.kind === "肌肉" && section.abnormal > 0);
  const attentionCount = attention.reduce((sum, section) => sum + section.abnormal, 0);
  return `
    ${header()}
    ${planCard()}
    <section class="mx-4 mt-4 rounded-xl bg-card p-4">
      <div class="flex items-start justify-between gap-2">
        <div>
          <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">需要先处理的肌群</p>
          <p class="mt-1 text-[11px] leading-relaxed text-muted-foreground">先看这些；处理完再回到全部区域。</p>
        </div>
        <span class="shrink-0 rounded-full bg-destructive/15 px-2.5 py-1 text-[10px] text-destructive">${attention.length} 个 · ${attentionCount} 处</span>
      </div>
      <div class="mt-3 space-y-2">
        ${attention.length === 0 ? `<p class="rounded-lg bg-muted px-3 py-2 text-[11px] text-muted-foreground">目前没有需要优先处理的肌群。</p>` : attention.map((section) => `
          <button type="button" class="flex w-full items-start gap-2 rounded-lg bg-muted px-3 py-2 text-left" data-section="${section.id}">
            <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-destructive"></span>
            <span class="min-w-0 flex-1">
              <span class="block text-[11px]">${section.label}</span>
              <span class="mt-0.5 block truncate text-[10px] text-destructive">${section.worst}</span>
            </span>
            <span class="shrink-0 text-[10px] text-destructive">${section.abnormal} 处</span>
          </button>
        `).join("")}
      </div>
    </section>
    <section class="mx-4 mt-4">
      <div class="flex items-end justify-between">
        <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">全部区域</p>
        <p class="text-[10px] text-muted-foreground">${SECTIONS.length} 个 · ${TOTAL} 处</p>
      </div>
      <div class="mt-2 grid grid-cols-2 gap-2">${SECTIONS.map(sectionTile).join("")}</div>
    </section>
    ${dataBlock()}
  `;
}

function axisChip([label, value, tone]) {
  if (tone === "unmeasured") {
    return `<span class="rounded-full border border-dashed border-border px-2 py-0.5 text-[10px] text-muted-foreground" data-testid="site-axis">${label} 未测</span>`;
  }
  const classes = tone === "bad"
    ? "bg-destructive/15 text-destructive"
    : tone === "accent"
      ? "bg-accent/15 text-accent"
      : "bg-muted text-muted-foreground";
  return `<span class="${classes} rounded-full px-2 py-0.5 text-[10px]">${label} ${value}</span>`;
}

function siteCard(card) {
  const resolved = card.resolved
    ? `<span class="text-[10px] text-primary" data-testid="site-${card.slug}-resolved">已解决</span>`
    : "";
  return `
    <div class="proto-site rounded-xl bg-card" data-testid="site-${card.slug}">
      <button type="button" class="w-full px-4 py-3.5 text-left" data-expand data-testid="site-${card.slug}-toggle">
        <div class="flex items-baseline justify-between gap-2">
          <p class="text-[15px] font-medium ${card.resolved ? "text-muted-foreground" : ""}">
            ${card.site} <span class="text-[10px] font-normal text-muted-foreground">${card.side}</span>
            ${resolved}
          </p>
          <span class="text-[10px] text-muted-foreground">${card.at}</span>
        </div>
        <div class="mt-2 flex flex-wrap gap-1.5">${card.axes.map(axisChip).join("")}</div>
        <span class="chev mt-2 block text-right text-[10px] text-muted-foreground transition-transform">⌄ 展开依据</span>
      </button>
      <div class="detail border-t border-border px-4 py-3">
        <p class="text-[10px] uppercase tracking-[0.16em] text-muted-foreground">依据 · ${card.at}</p>
        <div class="mt-1.5 space-y-1 text-[11px] leading-relaxed">
          ${card.evidence.map(([name, text]) => `<p><span class="text-muted-foreground">${name}：</span>${text}</p>`).join("")}
        </div>
        <div class="mt-2.5 flex flex-wrap gap-2">
          ${card.resolved ? "" : `<button type="button" class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-muted-foreground" data-testid="mark-resolved-${card.slug}">标记已解决</button>`}
          <button type="button" class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-destructive" data-testid="retract-${card.slug}">判定有误</button>
          <button type="button" class="rounded-full bg-muted px-2.5 py-1 text-[10px] text-muted-foreground" data-testid="open-timeline-${card.slug}">看时间线（3 条）</button>
        </div>
      </div>
    </div>
  `;
}

function subpageHeader(eyebrow, title, note, testid) {
  return `
    <div class="px-4 pt-3">
      <button type="button" style="min-height:44px" class="text-[11px] text-accent" data-back data-testid="back">← 回档案</button>
    </div>
    <header class="px-4">
      <p class="text-[11px] text-muted-foreground">${eyebrow}</p>
      <h1 class="mt-0.5 text-[20px] font-semibold tracking-tight">${title}</h1>
      <p class="mt-1 text-[11px] leading-relaxed text-muted-foreground">${note}</p>
    </header>
    <div data-testid="${testid}"></div>
  `;
}

function sectionPage() {
  const section = SECTION_BY_ID[state.section] || SECTIONS[0];
  const cards = section.cards.length > 0 ? section.cards : [
    {
      site: section.label, side: "示例", slug: "example", at: section.latest, abnormal: false,
      axes: [["张力", "正常", "muted"], ["对称", "对称", "muted"], ["活动度", "正常", "muted"], ["疼痛", "无", "muted"], ["稳定性", "未测", "unmeasured"]],
      evidence: [["用户说法", "这个区域还没有展开的原型卡片。"], ["验证方案", "—"], ["推理", "—"], ["不确定", "—"]],
      resolved: false,
    },
  ];
  return `
    ${subpageHeader("档案条目 · " + section.kind, section.label, `${section.count} 处判定 · ${section.abnormal} 处需要注意`, "section-page")}
    ${section.abnormal > 0 ? `
      <div class="proto-border-bad mx-4 mt-3 rounded-xl bg-card px-4 py-3">
        <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">${section.kind === "肌肉" ? "肌群整体 · 成员最差值" : "区域整体 · 最差的一条"}</p>
        <p class="mt-1 text-[11px] text-destructive">${section.worst}</p>
        <p class="mt-1 text-[10px] text-muted-foreground">每条轴各自取成员里最差的值；这里指名最差的那一条来自哪个部位。</p>
      </div>
    ` : ""}
    <div class="mx-4 mt-3 space-y-2">${cards.map(siteCard).join("")}</div>
    <div class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <p class="text-[10px] text-muted-foreground">这一页只放本区域的部位卡。展开依据、时间线与更正都在这里完成，根页不会再被单条判定撑长。</p>
    </div>
  `;
}

function planPage() {
  const exercises = [
    ["臀桥", "3×10", "臀大肌 左", "gluteal-group"],
    ["蚌式开合", "3×12", "臀中肌 左", "gluteal-group"],
    ["死虫", "3×8", "腰大肌 双侧", "hip-flexors"],
    ["提踵", "3×15", "腓肠肌 左", "posterior-leg-superficial"],
  ];
  return `
    ${subpageHeader("计划", "第 3 版", "每周 3 次 · 复查 12月8日 · 还有 21 天", "plan-page")}
    <div class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <div class="flex items-center justify-between">
        <p class="text-[13px] font-medium">每周 3 次 · 每次 30 分钟</p>
        <span class="text-[10px] text-primary">生效中</span>
      </div>
      <p class="mt-1 text-[10px] text-muted-foreground">复查日到了以后，今日页会提示重新评估；旧版本只读可查。</p>
    </div>
    <section class="mx-4 mt-3">
      <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">动作 · 4 个</p>
      <div class="mt-2 space-y-2">
        ${exercises.map(([name, dose, from, section], index) => `
          <div class="flex items-center gap-3 rounded-xl bg-card px-4 py-3">
            <div class="min-w-0 flex-1">
              <p class="text-[13px] font-medium">${name} · ${dose}</p>
              <p class="mt-0.5 text-[10px] text-muted-foreground">来自「${from}」的判定</p>
            </div>
            <button type="button" class="text-[10px] text-accent" data-section="${section}" data-testid="plan-exercise-${index}">看判定</button>
          </div>
        `).join("")}
      </div>
    </section>
    <section class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <p class="text-[10px] uppercase tracking-[0.18em] text-muted-foreground">历史版本 · 2</p>
      <p class="mt-2 text-[10px] text-muted-foreground">第 2 版 · 每周 3 次 · 3 个动作（只读）</p>
      <p class="mt-1 text-[10px] text-muted-foreground">第 1 版 · 每周 2 次 · 3 个动作（只读）</p>
    </section>
    <div class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <p class="text-[10px] text-muted-foreground">原型：计划摘要留在根页，完整动作与历史版本进这个子页；点「看判定」直接进对应区域。</p>
    </div>
  `;
}

function dataPage() {
  const [title, value, note] = DATA_PAGES[state.dataPage] || DATA_PAGES.basics;
  return `
    ${subpageHeader("我的数据", title, value, "data-page")}
    <div class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <p class="text-[11px] leading-relaxed text-muted-foreground">${note}</p>
    </div>
    <div class="mx-4 mt-3 rounded-xl bg-card px-4 py-3">
      <p class="text-[10px] text-muted-foreground">原型只验证“根页摘要 → 子页”的进入与返回；表单、图表和容量明细沿用现有实现。</p>
    </div>
  `;
}

function render() {
  switcherName.textContent = VARIANTS[state.variant].name;
  switcherHint.textContent = VARIANTS[state.variant].hint + " · 切回根页";
  if (state.page === "section") {
    app.innerHTML = sectionPage();
  } else if (state.page === "plan") {
    app.innerHTML = planPage();
  } else if (state.page === "data") {
    app.innerHTML = dataPage();
  } else if (state.variant === "B") {
    app.innerHTML = rootB();
  } else if (state.variant === "C") {
    app.innerHTML = rootC();
  } else if (state.variant === "D") {
    app.innerHTML = rootD();
  } else {
    app.innerHTML = rootA();
  }
  writeHash();
}

function setVariant(next) {
  state.variant = next;
  goRoot();
  render();
}

function stepVariant(delta) {
  const keys = Object.keys(VARIANTS);
  const index = keys.indexOf(state.variant);
  setVariant(keys[(index + delta + keys.length) % keys.length]);
}

app.addEventListener("click", (event) => {
  const variantStep = event.target.closest("[data-variant-step]");
  if (variantStep) {
    stepVariant(Number(variantStep.dataset.variantStep));
    return;
  }
  const back = event.target.closest("[data-back]");
  if (back) {
    goRoot();
    render();
    return;
  }
  const section = event.target.closest("[data-section]");
  if (section) {
    state.page = "section";
    state.section = section.dataset.section;
    state.dataPage = null;
    render();
    return;
  }
  const page = event.target.closest("[data-page]");
  if (page) {
    state.page = page.dataset.page;
    state.section = null;
    state.dataPage = null;
    render();
    return;
  }
  const data = event.target.closest("[data-data]");
  if (data) {
    const key = data.dataset.data;
    if (DATA_PAGES[key]) {
      state.page = "data";
      state.dataPage = key;
      state.section = null;
      render();
    } else {
      // 设置页不在本次原型范围内：给一个明确的占位提示。
      state.page = "data";
      state.dataPage = "basics";
      render();
    }
    return;
  }
  const filter = event.target.closest("[data-filter]");
  if (filter) {
    state.filter = filter.dataset.filter;
    render();
    return;
  }
  const expand = event.target.closest("[data-expand]");
  if (expand) {
    const card = expand.closest(".proto-site");
    card.classList.toggle("open");
  }
});

document.getElementById("switcher").addEventListener("click", (event) => {
  const step = event.target.closest("[data-variant-step]");
  if (step) stepVariant(Number(step.dataset.variantStep));
});

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, textarea, [contenteditable='true']")) return;
  if (event.key === "ArrowLeft") {
    event.preventDefault();
    stepVariant(-1);
  } else if (event.key === "ArrowRight") {
    event.preventDefault();
    stepVariant(1);
  }
});

readHash();
render();
</script>
</body>
</html>
