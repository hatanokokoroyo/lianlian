<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>3D 身体图 · lianlian</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body data-ui="1">
<main id="app">
  <canvas id="scene" tabindex="-1" aria-label="3D 人体模型，可拖动旋转、双指缩放、点选肌肉"></canvas>

  <div id="ui" class="ui">
    <p class="tier-notice" id="tier-notice" role="status" aria-live="polite" hidden>已切到流畅档</p>
    <div class="bottom-stack">
      <p class="gesture-hint" id="gesture-hint">拖动旋转 · 双指缩放 · 点肌肉看详情</p>
      <div class="controls">
        <div class="segmented" role="group" aria-label="视角">
          <button type="button" data-view="front" aria-pressed="true" aria-label="正视">正</button>
          <button type="button" data-view="back" aria-pressed="false" aria-label="背视">背</button>
          <button type="button" data-view="left" aria-pressed="false" aria-label="左视">左</button>
          <button type="button" data-view="right" aria-pressed="false" aria-label="右视">右</button>
        </div>
        <div class="menu-row">
          <div class="menu-wrap">
            <button
              type="button"
              class="menu-trigger"
              id="preset-trigger"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="preset-menu"
              aria-label="层级：全身"
            >
              <span>层级：<span id="preset-label">全身</span></span>
              <span class="menu-caret" aria-hidden="true">▾</span>
            </button>
            <div class="menu" id="preset-menu" role="menu" aria-label="层级" hidden>
              <button type="button" role="menuitemradio" data-preset="all" aria-checked="true">全身</button>
              <button type="button" role="menuitemradio" data-preset="shallow" aria-checked="false">浅层</button>
              <button type="button" role="menuitemradio" data-preset="deep" aria-checked="false">深层</button>
              <button type="button" role="menuitemradio" data-preset="bone" aria-checked="false">骨骼</button>
            </div>
          </div>
          <button
            type="button"
            class="attention-trigger"
            id="attention-trigger"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="attention-sheet"
            hidden
          >
            <span>需注意 <span id="attention-count">0</span> 处</span>
            <span class="attention-caret" aria-hidden="true">›</span>
          </button>
        </div>
      </div>
    </div>

    <section
      id="detail-sheet"
      class="detail-sheet"
      role="dialog"
      aria-labelledby="sheet-title"
      tabindex="-1"
      hidden
    >
      <div class="sheet-head" id="sheet-head">
        <span class="sheet-grip" aria-hidden="true"></span>
        <div class="sheet-heading">
          <h2 id="sheet-title"></h2>
          <span class="sheet-side" id="sheet-side"></span>
        </div>
        <button type="button" class="sheet-close" id="sheet-close" aria-label="关闭详情">×</button>
      </div>
      <div class="sheet-body">
        <div class="sheet-axes" id="sheet-axes"></div>
        <p class="sheet-worst" id="sheet-worst"></p>
      </div>
      <div class="sheet-actions">
        <button type="button" class="sheet-primary" id="sheet-isolate" aria-pressed="false">只看这块</button>
        <button type="button" class="sheet-secondary" id="sheet-open">在档案里看依据 ›</button>
      </div>
    </section>

    <section
      id="attention-sheet"
      class="attention-sheet"
      role="dialog"
      aria-labelledby="attention-title"
      tabindex="-1"
      hidden
    >
      <div class="sheet-head attention-head" id="attention-head">
        <span class="sheet-grip" aria-hidden="true"></span>
        <div class="sheet-heading">
          <h2 id="attention-title">需要注意</h2>
        </div>
        <button type="button" class="sheet-close" id="attention-close" aria-label="关闭需要注意列表">×</button>
      </div>
      <p class="attention-legend" id="attention-legend" aria-label="红＝需要注意 · 青/橙＝左/右">
        <span class="legend-dot legend-abnormal" aria-hidden="true"></span>红＝需要注意
        <span class="legend-sep" aria-hidden="true">·</span>
        <span class="legend-dot legend-left" aria-hidden="true"></span>
        <span class="legend-dot legend-right" aria-hidden="true"></span>青/橙＝左/右
      </p>
      <div class="attention-list" id="attention-list"></div>
    </section>
  </div>

  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true"><span></span></div>
    <h2 id="loading-title">正在载入身体模型…</h2>
    <p id="loading-slow" hidden>设备较慢时，可以先回档案页看依据</p>
    <button type="button" class="loading-retry" id="loading-retry" hidden>重试</button>
  </div>

  <noscript>这个原型需要 JavaScript 与 WebGL2。</noscript>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
